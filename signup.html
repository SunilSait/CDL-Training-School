<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — RoadMaster CDL Student Portal</title>
    <meta name="description" content="Create your RoadMaster CDL student account to enroll in training programs, track your progress, and access course materials.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{if(localStorage.getItem('cdl-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('cdl-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body class="auth-page">

<div class="auth-topbar">
    <div class="auth-topbar-actions">
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle layout direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
        </button>
    </div>
</div>

<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;">
    <div class="auth-card">
        <div class="auth-card-orb"></div>

        <a href="index.html" class="nav-logo auth-card-logo" aria-label="RoadMaster CDL Home">
            <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#151210"/><stop offset="100%" stop-color="#231E1B"/></linearGradient></defs>
                <rect width="100" height="100" rx="18" fill="url(#logoBg)"/>
                <path d="M20 62 L20 48 Q20 38 30 38 L70 38 Q80 38 80 48 L80 62 Z" fill="none" stroke="#C2410C" stroke-width="4"/>
                <circle cx="32" cy="66" r="8" fill="none" stroke="#C2410C" stroke-width="3.5"/>
                <circle cx="68" cy="66" r="8" fill="none" stroke="#C2410C" stroke-width="3.5"/>
                <rect x="24" y="44" width="16" height="10" rx="2" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
                <path d="M44 44 L56 44 L60 54 L44 54 Z" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
            </svg>
            <div class="nav-logo-text">
                <span class="brand-top">CDL Training</span>
                <span class="brand-bottom">RoadMaster</span>
            </div>
        </a>

        <div style="text-align:center;margin-bottom:1.75rem;">
            <h1 style="font-size:1.5rem;margin-bottom:0.375rem;font-weight:600;">Create Your Account</h1>
            <p style="font-size:0.875rem;color:var(--text-muted);">Start your journey to a CDL career</p>
        </div>

        <div class="social-login-grid">
            <button type="button" class="social-btn" title="Sign up with Google" aria-label="Sign up with Google">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            </button>
            <button type="button" class="social-btn" title="Sign up with Apple" aria-label="Sign up with Apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            </button>
            <button type="button" class="social-btn" title="Sign up with Facebook" aria-label="Sign up with Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </button>
        </div>

        <div class="divider">or sign up with email</div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" id="signup-form">
            <div class="form-group">
                <label class="form-label" for="signup-first">First Name</label>
                <input type="text" id="signup-first" class="form-input" placeholder="John" autocomplete="given-name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-last">Last Name</label>
                <input type="text" id="signup-last" class="form-input" placeholder="Doe" autocomplete="family-name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-email">Email Address</label>
                <input type="email" id="signup-email" class="form-input" placeholder="john@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-phone">Phone Number</label>
                <input type="tel" id="signup-phone" class="form-input" placeholder="(555) 123-4567" autocomplete="tel">
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="signup-password" class="form-input" placeholder="Create a password" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-password', this)" aria-label="Toggle password visibility">
                        <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-confirm', this)" aria-label="Toggle password visibility">
                        <span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    </button>
                </div>
            </div>
            <div style="margin-bottom:1.5rem;">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="agree-terms" required>
                    <label for="agree-terms">I agree to the <a href="coming-soon.html" class="link-primary">Terms of Service</a> and <a href="coming-soon.html" class="link-primary">Privacy Policy</a></label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg">Create Account</button>
        </form>

        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
            Already have an account? <a href="login.html" class="link-primary">Sign In</a>
        </p>
    </div>
</main>

<script src="components.js"></script>
<script>document.addEventListener('DOMContentLoaded', function() { initAuthPage(); });</script>
</body>
</html>
