<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;min-width:0;margin:0 auto;">
        <div class="coming-soon-icon">
            <i class="fas fa-truck-ramp-box"></i>
        </div>

        <h1 style="font-size:2rem;font-weight:700;margin-bottom:0.5rem;">Coming Soon</h1>
        <p class="error-desc" style="margin-bottom:2rem;">
            We're gearing up something exciting! This page is currently under construction and will be available soon. Stay tuned for updates.
        </p>

        <div class="countdown-grid">
            <div class="countdown-item">
                <span class="cd-num" id="cd-days">14</span>
                <span class="cd-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="cd-num" id="cd-hours">08</span>
                <span class="cd-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="cd-num" id="cd-mins">42</span>
                <span class="cd-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="cd-num" id="cd-secs">17</span>
                <span class="cd-label">Seconds</span>
            </div>
        </div>

        <div style="max-width:380px;margin:0 auto 2rem;">
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1rem;text-align:center;">Get notified when we launch:</p>
            <form onsubmit="event.preventDefault(); alert('Thank you! We\'ll notify you when this page is ready.');" style="display:flex;gap:0.75rem;">
                <input type="email" class="form-input" placeholder="Enter your email" required style="flex:1;">
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>
        </div>

        <div class="fullscreen-actions">
            <a href="index.html" class="btn btn-secondary btn-lg"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    initAuthPage();

    // Countdown timer
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 14);

    function updateCountdown() {
        const now = new Date();
        const diff = targetDate - now;
        if (diff <= 0) return;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
});
</script>
</body>
</html>
