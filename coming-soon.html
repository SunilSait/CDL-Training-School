<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — RoadMaster CDL Training School</title>
    <meta name="description" content="This page is coming soon. Stay tuned for new features and content from RoadMaster CDL Training School.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{if(localStorage.getItem('cdl-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('cdl-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body class="fullscreen-page">

<div class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="RoadMaster CDL Home">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#151210"/><stop offset="100%" stop-color="#231E1B"/></linearGradient></defs>
            <rect width="100" height="100" rx="18" fill="url(#logoBg)"/>
            <path d="M20 62 L20 48 Q20 38 30 38 L70 38 Q80 38 80 48 L80 62 Z" fill="none" stroke="#C2410C" stroke-width="4"/>
            <circle cx="32" cy="66" r="8" fill="none" stroke="#C2410C" stroke-width="3.5"/>
            <circle cx="68" cy="66" r="8" fill="none" stroke="#C2410C" stroke-width="3.5"/>
            <rect x="24" y="44" width="16" height="10" rx="2" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
            <path d="M44 44 L56 44 L60 54 L44 54 Z" fill="none" stroke="white" stroke-width="2.5" opacity="0.8"/>
        </svg>
        <div class="nav-logo-text">
            <span class="brand-top">CDL Training</span>
            <span class="brand-bottom">RoadMaster</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;align-items:center;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle layout direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><i class="fas fa-moon"></i></span>
        </button>
    </div>
</div>

<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;min-width:0;margin:0 auto;">
        <div class="coming-soon-icon">
            <i class="fas fa-truck-ramp-box"></i>
        </div>

        <h1 style="font-size:2rem;font-weight:700;margin-bottom:0.5rem;">Coming Soon</h1>
        <p class="error-desc" style="margin-bottom:2rem;">
            We're gearing up something exciting! This page is currently under construction and will be available soon. Stay tuned for updates.
        </p>

        <div class="countdown-grid">
            <div class="countdown-item">
                <span class="cd-num" id="cd-days">14</span>
                <span class="cd-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="cd-num" id="cd-hours">08</span>
                <span class="cd-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="cd-num" id="cd-mins">42</span>
                <span class="cd-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="cd-num" id="cd-secs">17</span>
                <span class="cd-label">Seconds</span>
            </div>
        </div>

        <div style="max-width:380px;margin:0 auto 2rem;">
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1rem;text-align:center;">Get notified when we launch:</p>
            <form onsubmit="event.preventDefault(); alert('Thank you! We\'ll notify you when this page is ready.');" style="display:flex;gap:0.75rem;">
                <input type="email" class="form-input" placeholder="Enter your email" required style="flex:1;">
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>
        </div>

        <div class="fullscreen-actions">
            <a href="index.html" class="btn btn-secondary btn-lg"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    initAuthPage();

    // Countdown timer
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 14);

    function updateCountdown() {
        const now = new Date();
        const diff = targetDate - now;
        if (diff <= 0) return;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
});
</script>
</body>
</html>
